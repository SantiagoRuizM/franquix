name: Deploy

# Deploys the API to Cloudflare Containers after CI passes on main.
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with "Workers Scripts: Edit" and "Containers: Edit"
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account id
#   MONGODB_URI            - Atlas connection string (terraform output -raw mongodb_uri)
# Without CLOUDFLARE_API_TOKEN the deploy job is skipped, so forks and local-only setups stay green.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: wrangler deploy
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; skipping deployment."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.credentials.outputs.configured == 'true'

      - uses: actions/setup-node@v7
        if: steps.credentials.outputs.configured == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install
        if: steps.credentials.outputs.configured == 'true'
        run: npm ci

      # wrangler builds ../Dockerfile for linux/amd64 with the runner's Docker and pushes it
      # to the Cloudflare Registry; the secret is uploaded atomically with the new version
      - name: Deploy
        if: steps.credentials.outputs.configured == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          if [ -n "$MONGODB_URI" ]; then
            jq -n --arg uri "$MONGODB_URI" '{MONGODB_URI: $uri}' > "$secrets_file"
            npx wrangler deploy --secrets-file "$secrets_file"
          else
            npx wrangler deploy
          fi

