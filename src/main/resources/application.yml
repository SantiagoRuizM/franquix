spring:
  application:
    name: franquix
  profiles:
    default: local
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:franquix}
      # creates the unique indexes declared on the documents; they enforce the name rules
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  shutdown: graceful

franquix:
  # Bearer token required on every /api request. No default: the app refuses to start without it.
  api-token: ${API_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Franquix
    version: 1.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.franquix: INFO

---
spring:
  config:
    activate:
      on-profile: local
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/franquix}

# Development-only default so `./gradlew bootRun` works out of the box. Never used by `prod`.
franquix:
  api-token: ${API_TOKEN:local-dev-token}

logging:
  level:
    com.franquix: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

# Behind the hosting platform's proxy: trust X-Forwarded-Proto/Host to build public URLs
server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: never
