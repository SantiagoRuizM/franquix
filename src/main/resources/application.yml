spring:
  application:
    name: franquix
  profiles:
    default: local
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:franquix}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Franquix
    description: Franchiser as a Service - reactive franchise management API
    version: 1.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.franquix: INFO

---
spring:
  config:
    activate:
      on-profile: local
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/franquix}

logging:
  level:
    com.franquix: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

# Behind the Cloudflare Worker: trust X-Forwarded-Proto/Host to build public URLs
server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: '%d{ISO8601} %-5level [%thread] %logger{36} - %msg%n'
